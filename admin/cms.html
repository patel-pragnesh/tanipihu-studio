<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tani Pihu Treasure - Admin Panel</title>
  <!-- Session guard runs BEFORE Decap loads. If invalid, redirect immediately. -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('tpt_admin_session');
        var parsed = raw ? JSON.parse(raw) : null;
        if (!parsed || !parsed.expiresAt || parsed.expiresAt <= Date.now()) {
          window.location.replace('/admin/');
        }
      } catch (e) {
        window.location.replace('/admin/');
      }
    })();
  </script>
</head>
<body>
  <div id="nc-root"></div>
  <script>
    window.location.replace('/admin/panel.html');
  </script>
</body>
</html>
