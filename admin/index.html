<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tani Pihu Treasure - Admin Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f6f3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      max-width: 420px;
      width: 90%;
      background: #fff;
      border: 1px solid #d1bfae;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .login-card h2 {
      margin: 0 0 6px;
      color: #3a3b3c;
      font-size: 22px;
    }

    .login-card p {
      margin: 0 0 18px;
      color: #6c6d6d;
      font-size: 14px;
    }

    .form-row {
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-row label {
      font-size: 13px;
      color: #3a3b3c;
      font-weight: 600;
    }

    .form-row input {
      border: 1px solid #d1bfae;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 15px;
      outline: none;
      transition: border-color .15s;
    }

    .form-row input:focus {
      border-color: #6f8667;
    }

    .login-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      background: #6f8667;
      color: #fff;
      transition: background .15s;
    }

    .login-btn:hover:not(:disabled) {
      background: #5a6e54;
    }

    .login-btn:disabled {
      opacity: .6;
      cursor: default;
    }

    .status {
      margin-top: 12px;
      min-height: 18px;
      font-size: 13px;
      color: #3a3b3c;
      text-align: center;
    }

    .brand {
      font-size: 13px;
      color: #b0a090;
      margin-top: 22px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Admin Access</h2>
    <p>Enter your access code to open the admin panel.</p>

    <div class="form-row">
      <label for="admin-passcode">Access Code</label>
      <input id="admin-passcode" type="password" placeholder="Enter admin access code" autocomplete="current-password">
    </div>

    <button id="login-btn" class="login-btn">Login</button>
    <div id="status" class="status"></div>
  </div>

  <div class="brand">Tani Pihu Treasure &mdash; Admin</div>

  <script>
    const SESSION_KEY = 'tpt_admin_session';

    function setStatus(msg, isError) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.style.color = isError ? '#b00020' : '#2f6f44';
    }

    // If already logged in, go straight to CMS
    (function () {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.expiresAt && parsed.expiresAt > Date.now()) {
            window.location.replace('/admin/cms.html');
          }
        }
      } catch (_) {}
    })();

    document.getElementById('admin-passcode').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });

    document.getElementById('login-btn').addEventListener('click', async function () {
      const btn = document.getElementById('login-btn');
      const passcode = document.getElementById('admin-passcode').value;

      if (!passcode || passcode.trim().length < 4) {
        setStatus('Enter a valid access code.', true);
        return;
      }

      btn.disabled = true;
      setStatus('Checking access code\u2026', false);

      try {
        const response = await fetch('/api/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode: passcode.trim() })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          setStatus(result.error || 'Invalid access code.', true);
          return;
        }

        localStorage.setItem(SESSION_KEY, JSON.stringify({
          token: result.token,
          expiresAt: Date.now() + Number(result.expiresInMs || 0)
        }));

        setStatus('Login successful. Opening admin panel\u2026', false);
        window.location.replace('/admin/cms.html');

      } catch (err) {
        setStatus(err.message || 'Network error. Please retry.', true);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
